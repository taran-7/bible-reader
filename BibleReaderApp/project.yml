name: BibleReader
options:
  bundleIdPrefix: dev.taraniuk
  deploymentTarget:
    macOS: "14.0"
packages:
  BibleCore:
    path: ..
targets:
  BibleReader:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/bible.sqlite
        buildPhase: resources
        optional: true
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: BibleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taraniuk.BibleReader
        # NFR-1: лише Apple Silicon (Intel поза обсягом, рішення власника 2026-09-27).
        ARCHS: arm64
        PRODUCT_NAME: Bible Reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bible Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: YES
        # Експорт нотаток у файл, обраний користувачем (FR-24).
        ENABLE_USER_SELECTED_FILES: readwrite
        # Ілюстрації (FR-33…FR-35): єдиний мережевий доступ, після кліку, лише allowlist.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      - name: Generate bible.sqlite
        basedOnDependencyAnalysis: false
        script: |
          # База не комітиться: make перебудовує її, якщо її немає або змінилися
          # data/raw чи код імпорту (інакше стара схема тихо лишається в додатку).
          cd "$SRCROOT/.." && make db
  BibleReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../Tests/BibleReaderUITests
    dependencies:
      - target: BibleReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taraniuk.BibleReaderUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: BibleReader
schemes:
  BibleReader:
    build:
      targets:
        BibleReader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BibleReaderUITests
