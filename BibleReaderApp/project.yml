name: BibleReader
options:
  bundleIdPrefix: dev.taraniuk
  deploymentTarget:
    macOS: "14.0"
packages:
  BibleCore:
    path: ..
targets:
  BibleReader:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/bible.sqlite
        buildPhase: resources
        optional: true
    dependencies:
      - package: BibleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taraniuk.BibleReader
        PRODUCT_NAME: Bible Reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bible Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      - name: Generate bible.sqlite
        basedOnDependencyAnalysis: false
        script: |
          # База не комітиться: генеруємо з data/raw, якщо її ще немає.
          if [ ! -f "$SRCROOT/Resources/bible.sqlite" ]; then
            cd "$SRCROOT/.." && make db
          fi
schemes:
  BibleReader:
    build:
      targets:
        BibleReader: all
    run:
      config: Debug
