name: BibleReader
options:
  bundleIdPrefix: dev.taraniuk
  deploymentTarget:
    macOS: "14.0"
packages:
  BibleCore:
    path: ..
targets:
  BibleReader:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/bible.sqlite
        buildPhase: resources
        optional: true
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # App icon; source: design/app-icon.svg.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: BibleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taraniuk.BibleReader
        # NFR-1: Apple Silicon only (Intel out of scope, owner decision 2026-09-27).
        ARCHS: arm64
        PRODUCT_NAME: Bible Reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bible Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: YES
        # Exporting notes to a file chosen by the user (FR-24).
        ENABLE_USER_SELECTED_FILES: readwrite
        # Illustrations (FR-33…FR-35): the only network access, after a click, allowlist only.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      - name: Generate bible.sqlite
        basedOnDependencyAnalysis: false
        script: |
          # The database is not committed: make rebuilds it if it is missing or if
          # data/raw or the import code changed (otherwise an old schema silently stays in the app).
          cd "$SRCROOT/.." && make db
  BibleReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../Tests/BibleReaderUITests
    dependencies:
      - target: BibleReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taraniuk.BibleReaderUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: BibleReader
schemes:
  BibleReader:
    build:
      targets:
        BibleReader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BibleReaderUITests
