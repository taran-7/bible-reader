# CI — адаптація шаблону Project Factory під Swift/macOS.
# Дзеркалить локальні гейти: якщо тут не зелено, то не готово.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # check-trajectory читає трейлери Slice: з історії
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@1.13.2

      # --- статичні, швидкі, детерміновані ---
      - name: Traceability chain (і свіжість звіту)
        run: |
          node scripts/check-traceability.mjs --check-fresh
          node scripts/check-traceability.mjs ${{ github.ref_name == 'main' && '--release' || '' }}
      - name: Trajectory process audit (і свіжість звіту)
        run: |
          node scripts/check-trajectory.mjs --check-fresh
          node scripts/check-trajectory.mjs ${{ github.ref_name == 'main' && '--release' || '' }}
      - name: Factory integrity lock
        run: node scripts/check-factory-integrity.mjs
      - name: OpenSpec strict validation
        run: openspec validate --all --strict

      # --- тести ---
      - name: Swift tests + coverage
        run: make coverage
      - name: Coverage ratchet
        run: node scripts/check-coverage-ratchet.mjs

      # --- збірка додатка ---
      - name: Build app + UI tests (XCUITest)
        run: |
          brew install xcodegen
          (cd BibleReaderApp && xcodegen generate)
          # PD-14: спільна VM CI в 1,5–2× повільніша за Mac користувача; межа NFR-3 тут 2000 мс, на Mac — 1000.
          TEST_RUNNER_BIBLE_LAUNCH_BUDGET_MS=2000 make ui-test
      - name: Platform and size (NFR-1, NFR-5)
        run: node scripts/check-platform.mjs

      # --- докази ---
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence
          path: |
            docs/qa/traceability-report.md
            trace/trace.json
            coverage/coverage-summary.json
          if-no-files-found: ignore
