schema: spec-driven

context: |
  Language: uk
  All artifacts must be written in uk.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Bible Reader, native macOS app (SwiftUI, macOS 14+).
  Translations: KJV and Russian Synodal (public domain), one shown at a time.
  Architecture: Swift Package with BibleCore (models, BibleRepository, Reference),
  bible-import CLI (JSON -> bible.sqlite), BibleCoreTests; SwiftUI app in BibleReaderApp/.
  Storage: SQLite via GRDB.swift, FTS5 table verses_fts (unicode61 remove_diacritics 2), read-only bundled DB.
  Verification: `swift test` must pass; UI is verified manually.
  Background docs: AGENTS.md, ARCHITECTURE.md, docs/.

rules:
  tasks:
    - Each task names the test that proves it (TDD: red, then green)
  proposal:
    - Always include a Non-goals section (e.g. parallel view, verse-number mapping)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
